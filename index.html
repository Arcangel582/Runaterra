<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Inventario Runaterra</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">

    <section id="loginView" class="login-view">
      <div class="login-card">
        <h1>Inventario de Runaterra</h1>
        <p class="subtitle">Acceso de jugadores y DM</p>

        <form id="loginForm">
          <label for="usuario">Usuario</label>
          <input id="usuario" type="text" autocomplete="username" required />

          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" required />

          <button type="submit">Entrar</button>
        </form>

        <p id="loginMessage" class="message"></p>
      </div>
    </section>

    <section id="mainView" class="main-view hidden">

      <header class="topbar">
        <div>
          <h1 id="campaignTitle">Inventario de Runaterra</h1>
          <p id="sessionInfo">Sesión activa</p>
        </div>

        <button id="logoutBtn" class="secondary-button">Cerrar sesión</button>
      </header>

      <nav class="tabs">
	<button class="tab-button active" data-tab="ficha">Ficha</button>
	<button class="tab-button" data-tab="inventario">Items</button>
	<button class="tab-button" data-tab="dinero">Dinero</button>
	<button class="tab-button" data-tab="historial">Historial</button>
	<button class="tab-button" data-tab="versiones">Versiones</button>
      </nav>

      <section id="fichaTab" class="tab-content active">
        <div id="fichaContainer"></div>
      </section>

      <section id="inventarioTab" class="tab-content">
        <div id="inventarioContainer"></div>
      </section>

      <section id="dineroTab" class="tab-content">
        <div id="dineroContainer"></div>
      </section>

      <section id="historialTab" class="tab-content">
  	<div id="historialContainer"></div>
      </section>

      <section id="versionesTab" class="tab-content">
  	<div id="versionesContainer"></div>
      </section>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
